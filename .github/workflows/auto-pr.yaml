---
name: Infra PR Automation
on:
  repository_dispatch:
    types:
      - create-infra-pr
permissions:
  contents: write
  pull-requests: write
jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Decode Terraform
        run: |
          echo "${{ github.event.client_payload.file_content }}" | base64 --decode > main.tf
      # Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
      - name: Terraform Init
        run: terraform init -backend=false
      - name: Terraform Validate
        run: terraform validate
      - name: Terraform Format
        run: terraform fmt -check
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: infra-update-${{ github.event.client_payload.timestamp }}
          base: main
          commit-message: Terraform infra update
          title: Terraform Infrastructure Update
          body: Generated by Terraform AI Agent
