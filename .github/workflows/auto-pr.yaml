name: Infra PR Automation

on:
  repository_dispatch:
    types:
      - create-infra-pr

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Process Terraform File
        run: |
          DECODED_CONTENT=$(echo "${{ github.event.client_payload.file_content }}" | base64 --decode)

          if [ "${{ github.event.client_payload.operation }}" = "append" ]; then
            echo "" >> main.tf
            echo "$DECODED_CONTENT" >> main.tf
          else
            echo "$DECODED_CONTENT" > main.tf
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Set up GCP credentials
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' > $HOME/gcp-sa-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/gcp-sa-key.json" >> $GITHUB_ENV

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run:  terraform plan -refresh=false -no-color > plan.txt

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: infra-update-${{ github.event.client_payload.timestamp }}
          base: main
          commit-message: Terraform infra update
          title: Terraform Infrastructure Update
          body: Generated by Terraform AI Agent

      - name: Comment Plan on PR
        if: steps.cpr.outputs.pull-request-number != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan.txt', 'utf8');
            const prNumber = ${{ steps.cpr.outputs.pull-request-number }};

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `## 🛠 Terraform Plan Output\n\`\`\`\n${plan}\n\`\`\``
            });