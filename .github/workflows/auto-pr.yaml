name: Auto PR for Infra Updates

on:
  push:
    branches:
      - 'infra-update-*'

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Important for full branch history

      - name: Create PR if not exists
        run: |
          PR_NUMBER=$(gh pr list \
          --head ${{ github.ref_name }} \
          --base main \
          --json number \
          --jq '.[0].number')

          if [ -z "$PR_NUMBER" ]; then
            echo "No PR exists. Creating one..."
          gh pr create \
            --base main \
            --head ${{ github.ref_name }} \
            --title "Infrastructure Update: ${{ github.ref_name }}" \
            --body "This PR was generated by the Terraform AI Agent."
          else
            echo "PR already exists: #$PR_NUMBER"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Pull Request
        run: |
          gh pr create \
            --base main \
            --head ${{ github.ref_name }} \
            --title "Infrastructure Update: ${{ github.ref_name }}" \
            --body "This PR was generated by the Terraform AI Agent."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}