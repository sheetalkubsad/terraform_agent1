name: Auto PR for Infra Updates

on:
  push:
    branches:
      - 'infra-update-*'

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Important for full branch history

      - name: Check if PR already exists
        run: |
          if gh pr list --head ${{ github.ref_name }} --json number --jq '.[0].number' | grep .; then
            echo "PR already exists for this branch. Skipping."
            exit 0
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Pull Request
        run: |
          gh pr create \
            --base main \
            --head ${{ github.ref_name }} \
            --title "Infrastructure Update: ${{ github.ref_name }}" \
            --body "This PR was generated by the Terraform AI Agent."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}