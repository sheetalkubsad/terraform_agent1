name: Infra PR Automation

on:
  repository_dispatch:
    types: [create-infra-pr]

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Create branch
        id: create-branch
        run: |
          BRANCH="infra-update-${{ github.event.client_payload.timestamp }}"
          git checkout -b $BRANCH
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Write Terraform file
        run: |
          cat << 'EOF' > main.tf
          ${{ github.event.client_payload.file_content }}
          EOF

      - name: Commit changes
        run: |
          git config user.name "Terraform AI Agent"
          git config user.email "agent@github.com"
          git add main.tf
          git commit -m "Terraform infra update"

      - name: Push branch
        run: |
          BRANCH=$(cat branch_name.txt)
          git push origin $BRANCH

      - name: Create PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.create-branch.outputs.branch }}
          base: main
          title: "Terraform Infrastructure Update"
          body: "Generated by Terraform AI Agent"