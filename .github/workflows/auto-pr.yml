name: Auto Create PR

on:
  push:
    branches:
      - 'infra-update-*'

permissions:
  pull-requests: write
  contents: read

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Open Pull Request
        run: |
          # Use the built-in GitHub CLI to create the PR
          gh pr create \
            --title "Infrastructure Update: ${{ github.ref_name }}" \
            --body "This PR was generated by the Terraform AI Agent Control Plane." \
            --base main \
            --head ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}