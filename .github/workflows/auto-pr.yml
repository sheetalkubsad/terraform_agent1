name: Auto Create PR for Infra Updates

on:
  push:
    branches:
      - 'infra-update-*'

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}
          base: main
          title: "Terraform Infrastructure Update"
          body: |
            This PR was automatically generated by the Terraform AI Agent.